server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  client_max_body_size 20m;

  # Express API (docker-compose дахь "api" сервис)
  location /api/ {
    proxy_pass http://api:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /health { proxy_pass http://api:4000/health; }

  # Hash-тай статик файл — урт хугацаагаар кэшлэнэ
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Service worker, index.html — үргэлж шинэ
  location ~* (sw\.js|workbox-.*\.js|index\.html|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
  }

  # SPA: /verify/:code, /id/:token зэрэг бүх замыг index.html руу
  location / {
    try_files $uri $uri/ /index.html;
  }
}
