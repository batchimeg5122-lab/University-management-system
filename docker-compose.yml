# Их Засаг — production-тэй ойролцоо орчин
#   copy .env.docker.example .env      (Supabase URL, ANON key бөглөнө)
#   apps/api/.env                      (SERVICE_ROLE key гэх мэт — API-д)
#   docker compose up -d --build
#   → http://localhost:8080  (Web + /api proxy)
services:
  api:
    build: ./apps/api
    env_file: ./apps/api/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
    restart: unless-stopped
    expose:
      - "4000"

  web:
    build:
      context: ./apps/web
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
